name: Daily workout

on:
  schedule:
    # Every hour in the morning (GitHub cron is UTC: 06:00-09:00 UTC = 7-10 CET / 8-11 CEST).
    # Each run waits until last night's sleep has reached Garmin, plans the day
    # once, and later runs that morning stop straight away.
    # `python -m coach setup` sets this for your time zone.
    - cron: "0 6-9 * * *"
  workflow_dispatch:        # "Run workflow" button (also from the GitHub mobile app)
    inputs:
      dry_run:
        description: "Analyze only, don't upload to Garmin"
        type: boolean
        default: false

permissions:
  contents: write           # to save the plan history and the refreshed Garmin session

concurrency:
  group: coach
  cancel-in-progress: false

jobs:
  coach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Madrid     # your time zone, so "today" is your local date
      GARMIN_TOKENS_KEY: ${{ secrets.GARMIN_TOKENS_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}     # optional: AI coach
      TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}     # optional: your notes
    steps:
      # The coach commits your health data and your encrypted Garmin session,
      # so it refuses to run in a public repository.
      - name: Safety check
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          if [ "$private" != "true" ]; then
            echo "::warning::This repository is public. Garmin Coach stores personal health data and your Garmin session in the repository, so it only runs in a PRIVATE copy. See the README."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$GARMIN_TOKENS_KEY" ]; then
            echo "::notice::The GARMIN_TOKENS_KEY secret isn't set yet. Follow the setup in the README."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Daily workout
        if: steps.guard.outputs.run == 'true'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m coach run --dry-run
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python -m coach run --wait-for-sleep     # waits for your sleep data
          else
            python -m coach run                      # manual run: plan now
          fi

      - name: Save history and session
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "garmin-coach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data || true
          if ! git diff --cached --quiet; then
            git commit -m "Workout $(date +%F)"
            git push
          fi
