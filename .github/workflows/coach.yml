name: Daily workout

on:
  schedule:
    # Evening: plans tomorrow. Morning: checks today's plan with your sleep data.
    # GitHub cron is UTC and has no time zones, so this lists the UTC hours for
    # both winter and summer time (here 21:00 and 08:00-10:00 in Europe/Madrid);
    # the coach checks your local time (TZ below) and acts only from 21:00 and
    # from 08:00. Runs are at :17 and :47 because GitHub delays or drops
    # scheduled runs on the hour; extra runs stop straight away.
    # `python -m coach setup` sets this for your time zone.
    - cron: "17,47 6-9,19-21 * * *"
  workflow_dispatch:        # "Run workflow" button (also from the GitHub mobile app)
    inputs:
      dry_run:
        description: "Analyze only, don't upload to Garmin"
        type: boolean
        default: false

permissions:
  contents: write           # to save the plan history and the refreshed Garmin session

concurrency:
  group: coach
  cancel-in-progress: false

jobs:
  coach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Zurich     # your time zone, so "today" is your local date
      GARMIN_TOKENS_KEY: ${{ secrets.GARMIN_TOKENS_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}           # optional: AI coach (OpenAI)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}     # optional: AI coach (Claude)
      TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}     # optional: your notes
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}                   # optional: today's plan as a notification
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}       # optional: rides only in Strava (python -m coach strava)
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
    steps:
      # Each run's summary (your sleep, HRV, readiness, notes) is visible to
      # anyone who can see the repository's Actions, and your encrypted Garmin
      # session is committed, so it refuses to run in a public repository.
      - name: Safety check
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          if [ "$private" != "true" ]; then
            echo "::warning::This repository is public. Each run's summary shows your health data and your Garmin session is stored in the repository, so Garmin Coach only runs in a PRIVATE copy. See the README."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$GARMIN_TOKENS_KEY" ]; then
            echo "::notice::The GARMIN_TOKENS_KEY secret isn't set yet. Follow the setup in the README."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Daily workout
        if: steps.guard.outputs.run == 'true'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m coach run --auto --dry-run       # analyze only
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python -m coach run --scheduled            # morning check or evening plan, by your local time
          else
            python -m coach run --auto                 # manual run: today, or tomorrow after the evening plan time
          fi

      # The only files the coach commits: your Garmin session (and Strava's token,
      # if connected), encrypted, when they're refreshed. Everything else is read back from Garmin and Todoist.
      - name: Save the refreshed Garmin session
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "garmin-coach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/garmin_tokens.enc || true
          git add data/strava_token.enc 2>/dev/null || true      # only if Strava is connected (encrypted too)
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Garmin session"
            # the repository may have changed during the run (e.g. you pushed):
            # put the session on top of the latest version and try again
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
              sleep 3
            done
          fi
