# ─────────────────────────────────────────────────────────────
#  Garmin Coach – configuration
#  Edit this file for your own races and week, then commit it
#  to YOUR private copy of the repository.
# ─────────────────────────────────────────────────────────────

athlete:
  # Approximate easy pace (min/km). Only used to estimate workout duration
  # in Garmin; intensity targets are heart-rate zones.
  easy_pace_min_per_km: 6.0
  pool_length_m: 25

# A Monday near the start of your plan. 4-week cycles (3 load weeks +
# 1 deload week) are counted from here.
plan_start: 2026-10-12

# Your target races, in any order. Examples below: replace them with yours.
#   kind: road (with distance_km) | 5k | 10k | half | marathon | tri_sprint | tri_olympic
#   priority: A (main goal) | B (secondary)
# Short races (up to 12 km) and triathlons get their own phases; the plan
# always prepares for the next race on the calendar.
races:
  - name: Autumn 10K
    date: 2026-12-13
    kind: 10k
    priority: B
  - name: Spring half marathon
    date: 2027-04-11
    kind: half
    priority: A
  - name: Summer sprint triathlon
    date: 2027-06-27
    kind: tri_sprint
    priority: A

# Maximum weekly running km per goal type. The plan ramps volume up gradually
# (≈ +8 %/week) from what you actually ran over the last 4 weeks.
peak_weekly_run_km:
  short: 32
  half: 42
  tri: 30
min_weekly_run_km: 15
# Return-to-running mode: if your last 4 weeks average less than this many
# km/week of running, the plan starts at this volume, grows ~20 %/week up to
# min_weekly_run_km, and replaces hard sessions with easy runs + strides.
return_to_run_below_km: 10

# Weekly template. Days: mon tue wed thu fri sat sun
# Available sessions:
#   rest
#   run_easy  run_strides  run_quality  run_long  run_brick
#   bike_easy bike_long    bike_quality
#   swim_technique swim_endurance swim_css
# Running-only athlete? Replace the bike/swim sessions with rest or run_easy.
weekly_templates:
  # Used while the next race is a running race:
  # 3 run days with rest in between, 2 bike days, 1 swim.
  run_focus:
    mon: [rest]
    tue: [run_quality]
    wed: [bike_easy]
    thu: [run_strides]
    fri: [swim_technique]
    sat: [bike_long]
    sun: [run_long]
  # Used while the next race is a triathlon: 2 swims, bike intensity
  # and a bike→run brick on Saturdays.
  triathlon:
    mon: [swim_technique]
    tue: [run_quality]
    wed: [bike_quality]
    thu: [swim_endurance]
    fri: [rest]
    sat: [bike_long, run_brick]
    sun: [run_long]

garmin:
  # Where `python -m coach login` saves your session on your computer
  # (outside the repository). On GitHub the session is stored encrypted
  # in data/garmin_tokens.enc instead.
  tokenstore: ~/.garminconnect
  upload: true
  workout_prefix: "Coach"
